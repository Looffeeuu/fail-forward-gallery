openapi: 3.1.0
info:
  title: Fail Forward Gallery Account, Story, and Moderation API
  version: 0.2.0
  description: China-first mobile verification, private cookie session, owned story submission, comments and follow-ups, withdrawal and appeals, reports, notifications, rankings, safety holds, team management, policy consent, public approved-content feed, and role-protected human moderation contract.
servers:
  - url: /
    description: Same-origin deployment
paths:
  /api/v1/health:
    get:
      summary: Check whether the HTTP service is running
      operationId: getHealth
      responses:
        '200':
          description: Lightweight liveness response with no account or content data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, version]
                properties:
                  status:
                    const: ok
                  service:
                    const: fail-forward-gallery
                  version:
                    const: 0.2.0
  /api/v1/auth/session:
    get:
      summary: Restore the current private session and issue a CSRF token
      operationId: restoreSession
      responses:
        '200':
          description: Session state. The response never includes a mobile number or account ID.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly SameSite CSRF cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/v1/auth/sms-code:
    post:
      summary: Request a one-time SMS verification code
      operationId: requestPhoneCode
      description: Production will send through an approved mainland SMS provider. Development prints the code only to the server terminal.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, privacyVersion]
              properties:
                phone:
                  type: string
                  pattern: '^\+861[3-9][0-9]{9}$'
                privacyVersion:
                  type: string
                  description: The privacy notice version the person agreed to; must match policies.json (otherwise privacy-consent-required).
      responses:
        '202':
          description: Request accepted without revealing whether an account already exists.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, expiresInSeconds, phoneHint]
                properties:
                  status:
                    const: accepted
                  expiresInSeconds:
                    type: integer
                  phoneHint:
                    type: string
                    pattern: '^\*{6}[0-9]{4}$'
        '400':
          $ref: '#/components/responses/InvalidPhone'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/sms-code/verify:
    post:
      summary: Verify a six-digit SMS code and create a private session
      operationId: verifyPhoneCode
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code, privacyVersion]
              properties:
                privacyVersion:
                  type: string
                  description: The privacy notice version the person agreed to; must match policies.json (otherwise privacy-consent-required).
                phone:
                  type: string
                  pattern: '^\+861[3-9][0-9]{9}$'
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Verification succeeded and an HttpOnly session cookie was set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure in production, HttpOnly and SameSite session and CSRF cookies.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, csrfToken]
                properties:
                  account:
                    $ref: '#/components/schemas/PublicClientAccount'
                  csrfToken:
                    type: string
                    description: Rotated token kept only in browser memory.
        '400':
          $ref: '#/components/responses/InvalidCode'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/sign-out:
    post:
      summary: End the current session and rotate the CSRF token
      operationId: signOut
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Session ended and the session cookie was cleared.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
        '403':
          $ref: '#/components/responses/InvalidCsrf'
  /api/v1/stories:
    get:
      summary: List human-approved anonymous stories
      operationId: listPublishedStories
      description: Public feed. Pending, rejected, owner, account, and private review fields are never returned.
      responses:
        '200':
          description: Human-approved stories only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stories]
                properties:
                  stories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedStory'
    post:
      summary: Submit a story owned by the current private account
      operationId: createStory
      description: Ownership is always resolved from the HttpOnly session cookie. Client account identifiers are ignored. A new story is private and pending human review.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorySubmission'
      responses:
        '201':
          description: Story saved privately and queued for human review.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [story]
                properties:
                  story:
                    $ref: '#/components/schemas/OwnedStory'
        '400':
          description: Story validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '429':
          description: More than 3 stories in an hour (story-rate-limited, with Retry-After) or 3 awaiting review (too-many-pending-stories).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/stories:
    get:
      summary: List stories owned by the current private account
      operationId: listMyStories
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private owner view. No mobile number or account ID is returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stories]
                properties:
                  stories:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedStory'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/stories/{storyId}/comments:
    post:
      summary: Respond to a published story within the author's boundary
      operationId: createComment
      description: The response type is always the story's responsePreference. Stories with responsePreference none reject every comment. New comments stay private until a human approves them.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentSubmission'
      responses:
        '201':
          description: Comment saved privately and queued for human review.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comment]
                properties:
                  comment:
                    $ref: '#/components/schemas/OwnedComment'
        '400':
          description: The comment is empty or longer than 1000 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: The author chose not to receive comments (comments-closed), or the CSRF token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '409':
          description: The same account already sent this text to this story (duplicate-comment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 5 comments in 10 minutes (comment-rate-limited, with Retry-After), or 10 comments already awaiting review (too-many-pending-comments).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stories/{storyId}/follow-ups:
    post:
      summary: Add a follow-up to the current account's own published story
      operationId: createFollowUp
      description: Only the original author can add a follow-up. Anonymous-public follow-ups enter human review; private follow-ups are visible only to the author and never enter the public feed.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUpSubmission'
      responses:
        '201':
          description: Follow-up saved privately or queued for human review.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [followUp]
                properties:
                  followUp:
                    $ref: '#/components/schemas/OwnedFollowUp'
        '400':
          description: Follow-up validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: The current account is not the story author (follow-up-author-only), or the CSRF token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '429':
          description: More than 3 follow-ups in an hour, private ones included (follow-up-rate-limited, with Retry-After), or 3 awaiting review (too-many-pending-follow-ups).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/comments:
    get:
      summary: List comments written by the current private account
      operationId: listMyComments
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private owner view with review status and reasons.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedComment'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/moderation/comments:
    get:
      summary: List comments awaiting human review
      operationId: listModerationComments
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue with story context. Author account identifiers are not returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedComment'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/moderation/follow-ups:
    get:
      summary: List public follow-ups awaiting human review
      operationId: listModerationFollowUps
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue with story context. Author account identifiers are not returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [followUps]
                properties:
                  followUps:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedFollowUp'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/me/{contentPath}/{contentId}/withdraw:
    post:
      summary: Withdraw the current account's own story, comment, or follow-up
      operationId: withdrawContent
      description: Takes effect immediately in any state (pending, approved, rejected, or private). Withdrawn content leaves public feeds and review queues; the record and audit event are kept. Content owned by another account returns 404, so ownership is never revealed. Repeating the call is harmless.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContentPath'
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: The owner's view of the withdrawn content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [content]
                properties:
                  content:
                    $ref: '#/components/schemas/OwnedContent'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/ContentNotFound'
  /api/v1/me/{contentPath}/{contentId}/appeal:
    post:
      summary: Appeal a rejection of the current account's own content
      operationId: appealContent
      description: Each review decision (including a removal after a report) can be appealed once. Appeals enter the reviewer queue; any reviewer may decide them, including the original reviewer, who is told it was their decision.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContentPath'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealSubmission'
      responses:
        '201':
          description: Appeal recorded; the owner's view now carries appealStatus pending.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [content]
                properties:
                  content:
                    $ref: '#/components/schemas/OwnedContent'
        '400':
          description: Invalid reason code (invalid-appeal-reason) or explanation length (invalid-appeal-explanation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '409':
          description: The content is not rejected (appeal-not-available) or was already appealed (appeal-already-submitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/appeals:
    get:
      summary: List appeals awaiting re-review
      operationId: listModerationAppeals
      description: Appeals whose content was withdrawn are omitted. Reviewers learn only whether they made the original decision, never who did.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [appeals]
                properties:
                  appeals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationAppeal'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/moderation/appeals/{appealId}/decision:
    post:
      summary: Overturn or uphold an appealed rejection
      operationId: decideAppeal
      description: Overturning publishes the content immediately and records the new decision on its moderation case. Both outcomes add an audit event.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: appealId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [overturn, uphold]
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
      responses:
        '200':
          description: Appeal resolved.
          content:
            application/json:
              schema:
                type: object
                required: [appeal]
                properties:
                  appeal:
                    type: object
                    required: [id, status, contentType]
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [overturned, upheld]
                      contentType:
                        type: string
                        enum: [story, comment, follow_up]
        '400':
          description: The decision or reason is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The appeal was already resolved or its content withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/notifications:
    get:
      summary: List the current account's review notifications
      operationId: listNotifications
      description: The 30 most recent notices about decisions, appeals, and reports concerning the account's own content. In-site only; email delivery is not connected yet.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recent notifications and the unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/me/notifications/read:
    post:
      summary: Mark all of the current account's notifications as read
      operationId: markNotificationsRead
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The updated notification list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
  /api/v1/{contentPath}/{contentId}/reports:
    post:
      summary: Report another account's public story, comment, or follow-up
      operationId: reportContent
      description: Signed-in accounts only, once per item, at most 10 reports per hour. Reporters are never revealed to authors or reviewers. Own content cannot be reported.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContentPath'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSubmission'
      responses:
        '201':
          description: Report recorded for human re-review.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report:
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      reasonCode:
                        $ref: '#/components/schemas/ReportReasonCode'
                      status:
                        const: open
        '400':
          description: Invalid reason or details, or the content is the reporter's own (cannot-report-own-content).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '409':
          description: This account already reported this content (already-reported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 10 reports in an hour (report-rate-limited).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/reports:
    get:
      summary: List public content with open reports
      operationId: listReportedContent
      description: One entry per content item, safety concerns first. Reporter identities are not included. Content that is no longer public is omitted.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue.
          content:
            application/json:
              schema:
                type: object
                required: [reported]
                properties:
                  reported:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportedContent'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/moderation/reports/{contentPath}/{contentId}/decision:
    post:
      summary: Remove reported content or keep it
      operationId: decideReportedContent
      description: Removal unpublishes the content as a rejection with the given reason, which the author can appeal. Both outcomes resolve every open report on the item and notify the author (on removal) and each reporter.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContentPath'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [remove, dismiss, safety-hold]
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
      responses:
        '200':
          description: Reports resolved.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    properties:
                      contentType:
                        type: string
                      contentId:
                        type: string
                      status:
                        type: string
                        enum: [removed, kept, safety-hold]
        '400':
          description: The decision or reason is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: No open reports remain, or the content is no longer public.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rankings:
    get:
      summary: Public story rankings
      operationId: getRankings
      description: Story order only, refreshed at most once a minute. View, comment, and score figures are never included. Only currently public stories can appear; stories closed to responses never appear in mostDiscussed.
      responses:
        '200':
          description: Current rankings with the stories they reference.
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, refreshSeconds, rankings, stories]
                properties:
                  generatedAt:
                    type: string
                    format: date-time
                  refreshSeconds:
                    type: integer
                  rankings:
                    type: object
                    required: [trending, mostReadDay, mostReadWeek, mostDiscussed, recommended]
                    properties:
                      trending:
                        description: Unique views and approved responses over 72 hours, halving in weight every 24 hours (responses weigh 3x).
                        $ref: '#/components/schemas/StoryIdList'
                      mostReadDay:
                        $ref: '#/components/schemas/StoryIdList'
                      mostReadWeek:
                        $ref: '#/components/schemas/StoryIdList'
                      mostDiscussed:
                        $ref: '#/components/schemas/StoryIdList'
                      recommended:
                        type: array
                        items:
                          type: object
                          required: [storyId, reason]
                          properties:
                            storyId:
                              type: string
                            reason:
                              type: string
                  stories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedStory'
  /api/v1/stories/{storyId}/views:
    post:
      summary: Record that the story was opened
      operationId: recordStoryView
      description: Counts at most once per person per story per UTC day. Viewers are identified by account, or by an anonymous ffg_visitor cookie set here, hashed with a server secret and the date before storage. Authors' own views, probable bots, and excess new views from one network source are ignored. The response never says whether the view counted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StoryId'
      responses:
        '202':
          description: Accepted.
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/StoryNotFound'
  /api/v1/moderation/recommendations/{storyId}:
    put:
      summary: Add a public story to team picks
      operationId: recommendStory
      description: The reason is shown publicly with the pick. Replaces any existing pick of the same story.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 8
                  maxLength: 300
      responses:
        '200':
          description: Recommended.
        '400':
          description: Reason length is invalid (invalid-recommendation-reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '404':
          description: The story is not public.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a story from team picks
      operationId: unrecommendStory
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StoryId'
      responses:
        '200':
          description: Removed; the pick stays in history.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The story is not currently recommended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/safety-holds:
    get:
      summary: List content held for safety
      operationId: listHeldContent
      description: Content unpublished for care rather than for breaking rules, with the internal hold note. It stays here until a reviewer releases it or declines to publish it.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held:
                    type: array
                    items:
                      type: object
                      required: [contentType, content]
                      properties:
                        contentType:
                          type: string
                          enum: [story, comment, follow_up]
                        content:
                          $ref: '#/components/schemas/OwnedContent'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/moderation/safety-holds/{contentPath}/{contentId}/decision:
    post:
      summary: Release held content or decline to publish it
      operationId: decideHeldContent
      description: release publishes the content. reject turns the hold into an ordinary rejection whose reason the author sees and may appeal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContentPath'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [release, reject]
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
      responses:
        '200':
          description: Decision recorded.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The content is no longer held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/staff:
    get:
      summary: List reviewers, administrators, and recent role changes
      operationId: listTeam
      description: Administrators only. Staff are identified by the name an administrator gave them; phone numbers are never stored or returned.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Administrator access is required (administrator-required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Appoint someone as reviewer or administrator by mobile number
      operationId: appointStaff
      description: The number is only hashed to find or create the account, so the person need not have signed in before. Re-appointing a number updates its name and role. Administrators cannot change their own role this way.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, label, role]
              properties:
                phone:
                  type: string
                label:
                  type: string
                  minLength: 2
                  maxLength: 40
                role:
                  type: string
                  enum: [moderator, administrator]
      responses:
        '200':
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Invalid phone, name, or role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Administrator access is required, or the CSRF token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The number belongs to the administrator making the request and the role would change (cannot-change-own-role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/staff/{accountId}/role:
    post:
      summary: Change or remove a team member's role
      operationId: changeStaffRole
      description: member removes them from the team. Applies to their open sessions immediately. Administrators cannot change their own role, so at least one administrator always remains.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, moderator, administrator]
      responses:
        '200':
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Administrator access is required, or the CSRF token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not a current team member (staff-not-found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Administrators cannot change their own role (cannot-change-own-role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/consents:
    post:
      summary: Agree to the current version of a policy
      operationId: acceptPolicy
      description: Records the account, policy, version, and time. Writing a story requires the current community rules; signing in requires the current privacy notice (sent as privacyVersion with the code request and verification). Versions come from policies.json.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, version]
              properties:
                policy:
                  type: string
                  enum: [privacy, community]
                version:
                  type: string
      responses:
        '200':
          description: Current agreement status for every policy.
          content:
            application/json:
              schema:
                type: object
                required: [consents]
                properties:
                  consents:
                    $ref: '#/components/schemas/Consents'
        '400':
          description: Unknown policy (invalid-policy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '409':
          description: The version is not the current one (policy-version-outdated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/export:
    get:
      summary: Download everything held about the current account
      operationId: exportMyData
      description: Returned as a file attachment. Includes agreements, stories (with follow-ups and private reading figures), comments, appeals, reports filed, and notices. No phone number is stored, so none is included, and no internal account id is included.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The export, with Content-Disposition attachment.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/v1/me/delete-account:
    post:
      summary: Delete the current account
      operationId: deleteAccount
      description: Runs in one transaction and ends the session. With keepPublicContent, content that is public right now stays online owned by a placeholder account that can never sign in; otherwise it is deleted, with replies to deleted stories. Non-public content, appeals, and reports filed are always deleted. Moderation cases and events are kept with no link to the account. Staff must be removed from the team first.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  const: delete-my-account
                keepPublicContent:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, kept]
                properties:
                  deleted:
                    type: integer
                    description: The person's items removed.
                  kept:
                    type: integer
                    description: Public items kept anonymously.
        '400':
          description: Missing confirmation (deletion-not-confirmed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '409':
          description: Review team members must be removed by an administrator first (staff-cannot-delete).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/stories:
    get:
      summary: List stories awaiting human review
      operationId: listModerationStories
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private reviewer queue. Author account identifiers are not returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stories]
                properties:
                  stories:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedStory'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
  /api/v1/moderation/stories/{storyId}/decision:
    post:
      summary: Record an irreversible human review decision
      operationId: decideStory
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [approve, reject, safety-hold]
                  description: safety-hold keeps the content private for care, not as a rule violation; it cannot be appealed and the reason stays internal.
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
      responses:
        '200':
          description: Decision recorded in the story, moderation case, and immutable audit event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [story]
                properties:
                  story:
                    $ref: '#/components/schemas/OwnedStory'
        '400':
          description: The decision or reason is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The story is no longer awaiting a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/comments/{commentId}/decision:
    post:
      summary: Record a human review decision for a comment
      operationId: decideComment
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: Decision recorded on the content, its moderation case, and an audit event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comment]
                properties:
                  comment:
                    $ref: '#/components/schemas/OwnedComment'
        '400':
          description: The decision or reason is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The content is no longer awaiting a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/moderation/follow-ups/{followUpId}/decision:
    post:
      summary: Record a human review decision for a followUp
      operationId: decideFollowUp
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: followUpId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: Decision recorded on the content, its moderation case, and an audit event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [followUp]
                properties:
                  followUp:
                    $ref: '#/components/schemas/OwnedFollowUp'
        '400':
          description: The decision or reason is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ModeratorRequired'
        '409':
          description: The content is no longer awaiting a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ffg_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    ContentPath:
      name: contentPath
      in: path
      required: true
      schema:
        type: string
        enum: [stories, comments, follow-ups]
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
  schemas:
    PublicClientAccount:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        consents:
          $ref: '#/components/schemas/Consents'
        role:
          type: string
          enum: [member, moderator, administrator]
        status:
          type: string
          enum: [active, suspended]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, csrfToken]
      properties:
        authenticated:
          type: boolean
        account:
          $ref: '#/components/schemas/PublicClientAccount'
        csrfToken:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    StorySubmission:
      type: object
      additionalProperties: true
      required: [title, board, content, responsePreference, tags, guidelinesAccepted]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        board:
          type: string
          enum: [academic, job, social]
        content:
          type: string
          description: Must contain 150-200 combined Latin word and CJK character units.
        responsePreference:
          type: string
          enum: [none, encouragement, similar, advice]
        tags:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9]{0,39}$'
        guidelinesAccepted:
          const: true
    PublishedStory:
      type: object
      additionalProperties: false
      required: [id, board, title, content, responsePreference, tags, publishedAt, comments, followUps]
      properties:
        id:
          type: string
          format: uuid
        board:
          type: string
          enum: [academic, job, social]
        title:
          type: string
        content:
          type: string
        responsePreference:
          type: string
          enum: [none, encouragement, similar, advice]
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
        comments:
          type: array
          description: Human-approved comments only.
          items:
            $ref: '#/components/schemas/PublishedComment'
        followUps:
          type: array
          description: Human-approved anonymous-public follow-ups only.
          items:
            $ref: '#/components/schemas/PublishedFollowUp'
    OwnedStory:
      type: object
      additionalProperties: false
      required:
        - id
        - board
        - title
        - content
        - responsePreference
        - visibility
        - moderationStatus
        - automatedReviewStatus
        - humanReviewStatus
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        board:
          type: string
          enum: [academic, job, social]
        title:
          type: string
        content:
          type: string
        responsePreference:
          type: string
          enum: [none, encouragement, similar, advice]
        visibility:
          const: anonymous-public
        moderationStatus:
          type: string
          enum: [pending-human-review, approved, rejected, withdrawn, safety-hold]
        automatedReviewStatus:
          type: string
          enum: [not-configured, passed, rejected, needs-human-review]
        humanReviewStatus:
          type: string
          enum: [pending, approved, rejected, safety-hold]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        decisionReason:
          oneOf:
            - type: string
              minLength: 8
              maxLength: 500
            - type: 'null'
        decidedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        appealId:
          oneOf:
            - type: string
            - type: 'null'
        appealStatus:
          oneOf:
            - type: string
              enum: [pending, upheld, overturned]
            - type: 'null'
        appealReasonCode:
          oneOf:
            - $ref: '#/components/schemas/AppealReasonCode'
            - type: 'null'
        appealExplanation:
          oneOf:
            - type: string
            - type: 'null'
        appealDecisionReason:
          oneOf:
            - type: string
            - type: 'null'
        appealDecidedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        careSuggested:
          type: boolean
          description: Owner view only. True while flagged content awaits review or is held for safety; the client then shows caring support information. Internal hold notes and risk labels are never sent to authors.
        riskSignal:
          oneOf:
            - type: string
              description: Reviewer view only. Comma-separated keyword hints (self-harm, harm-to-others).
            - type: 'null'
        stats:
          type: object
          description: Owner view only. These figures never appear on public pages.
          properties:
            totalViews:
              type: integer
            weekViews:
              type: integer
            approvedComments:
              type: integer
        followUps:
          type: array
          description: Present in the owner view only; includes private follow-ups.
          items:
            $ref: '#/components/schemas/OwnedFollowUp'
    OwnedContent:
      oneOf:
        - $ref: '#/components/schemas/OwnedStory'
        - $ref: '#/components/schemas/OwnedComment'
        - $ref: '#/components/schemas/OwnedFollowUp'
    AppealReasonCode:
      type: string
      enum: [context-misunderstood, no-identifying-details, within-guidelines, other]
    AppealSubmission:
      type: object
      required: [reasonCode, explanation]
      properties:
        reasonCode:
          $ref: '#/components/schemas/AppealReasonCode'
        explanation:
          type: string
          minLength: 10
          maxLength: 1000
    ModerationAppeal:
      type: object
      required: [id, contentType, reasonCode, explanation, createdAt, originalDecisionByYou, content]
      properties:
        id:
          type: string
        contentType:
          type: string
          enum: [story, comment, follow_up]
        reasonCode:
          $ref: '#/components/schemas/AppealReasonCode'
        explanation:
          type: string
        status:
          const: pending
        createdAt:
          type: string
          format: date-time
        originalDecisionReason:
          type: string
        originalDecidedAt:
          type: string
          format: date-time
        originalDecisionByYou:
          type: boolean
        content:
          $ref: '#/components/schemas/OwnedContent'
    NotificationList:
      type: object
      additionalProperties: false
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            type: object
            required: [id, kind, contentType, contentId, storyTitle, createdAt]
            properties:
              id:
                type: string
              kind:
                type: string
                enum: [approved, rejected, appeal-overturned, appeal-upheld, removed, report-actioned, report-dismissed, safety-hold]
              contentType:
                type: string
                enum: [story, comment, follow_up]
              contentId:
                type: string
              storyTitle:
                type: string
                description: The story itself, or the story a comment or follow-up belongs to.
              createdAt:
                type: string
                format: date-time
              readAt:
                oneOf:
                  - type: string
                    format: date-time
                  - type: 'null'
        unreadCount:
          type: integer
          minimum: 0
    ReportReasonCode:
      type: string
      enum: [personal-information, harassment, encourages-harm, spam, outside-boundary, safety-concern, other]
    ReportSubmission:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReportReasonCode'
        details:
          type: string
          maxLength: 500
          description: Required (at least 5 characters) when reasonCode is other.
    ReportedContent:
      type: object
      required: [contentType, contentId, createdAt, reportCount, hasSafetyConcern, content, reports]
      properties:
        contentType:
          type: string
          enum: [story, comment, follow_up]
        contentId:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When the first open report was filed.
        reportCount:
          type: integer
        hasSafetyConcern:
          type: boolean
        content:
          $ref: '#/components/schemas/OwnedContent'
        reports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [reasonCode, details, createdAt]
            properties:
              reasonCode:
                $ref: '#/components/schemas/ReportReasonCode'
              details:
                type: string
              createdAt:
                type: string
                format: date-time
    StoryIdList:
      type: array
      maxItems: 10
      items:
        type: string
    Team:
      type: object
      required: [staff, changes]
      properties:
        staff:
          type: array
          items:
            type: object
            required: [accountId, label, role, isYou]
            properties:
              accountId:
                type: string
                description: Internal identifier, returned only to administrators.
              label:
                type: string
              role:
                type: string
                enum: [moderator, administrator]
              since:
                oneOf:
                  - type: string
                    format: date-time
                  - type: 'null'
              isYou:
                type: boolean
        changes:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              previousRole:
                type: string
              newRole:
                type: string
              changedByLabel:
                type: string
              byServerOperator:
                type: boolean
              createdAt:
                type: string
                format: date-time
    Consents:
      type: object
      required: [privacy, community]
      properties:
        privacy:
          $ref: '#/components/schemas/ConsentStatus'
        community:
          $ref: '#/components/schemas/ConsentStatus'
    ConsentStatus:
      type: object
      required: [version, accepted]
      properties:
        version:
