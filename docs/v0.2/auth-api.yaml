  responses:
    AuthenticationRequired:
      description: A valid private account session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidPhone:
      description: The mobile number is not a valid mainland China number.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCode:
      description: Code is invalid or expired; the response does not reveal account existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCsrf:
      description: The CSRF token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModeratorRequired:
      description: An authenticated moderator or administrator role is required, or the content is the reviewer's own (own-content); reviewers never decide on, resolve reports or appeals about, or recommend their own content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentNotFound:
      description: The content does not exist or belongs to another account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StoryNotFound:
      description: The story does not exist or has not been approved for publication.
      content:
        application/json:
          schema:
