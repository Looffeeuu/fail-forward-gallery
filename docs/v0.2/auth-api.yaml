openapi: 3.1.0
info:
  title: Fail Forward Gallery Authentication API
  version: 0.2.0
  description: Provider-neutral email verification and private session contract.
servers:
  - url: /
    description: Same-origin deployment
paths:
  /api/v1/auth/session:
    get:
      summary: Restore the current private session
      operationId: restoreSession
      responses:
        '200':
          description: Session state. The response never includes an email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/v1/auth/email-code:
    post:
      summary: Request a one-time email verification code
      operationId: requestEmailCode
      description: Returns the same accepted response whether or not an account already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Request accepted without revealing account existence.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: accepted
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/email-code/verify:
    post:
      summary: Verify a one-time code and create a private session
      operationId: verifyEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  minLength: 4
                  maxLength: 8
                  pattern: '^[0-9]+$'
      responses:
        '200':
          description: Verification succeeded and an HttpOnly session cookie was set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [account, csrfToken]
                properties:
                  account:
                    $ref: '#/components/schemas/PublicClientAccount'
                  csrfToken:
                    type: string
                    description: Short-lived token kept only in memory by the browser.
        '400':
          $ref: '#/components/responses/InvalidCode'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/sign-out:
    post:
      summary: End the current session
      operationId: signOut
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended and cookie cleared.
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    PublicClientAccount:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role:
          type: string
          enum: [member, moderator, administrator]
        status:
          type: string
          enum: [active, suspended]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        account:
          $ref: '#/components/schemas/PublicClientAccount'
        csrfToken:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    InvalidCode:
      description: Code is invalid or expired; the response does not reveal account existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
